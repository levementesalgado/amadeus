[package]
name = "amadeus"
version = "0.1.0"
edition = "2024"
description = "CPU-first LLM inference engine for the Hako compiler — born from the Mizu OS project"
default-run = "amadeus"

[dependencies]
# ═══════════════════════════════════════
# Core
# ═══════════════════════════════════════
half = "2"                          # f16 (BF16/FP16) for quantized weights
byteorder = "1"                     # binary format parsing (GGUF, safetensors)
memmap2 = "0.9"                     # mmap for zero-copy model loading
rayon = "1"                         # parallel tensor ops (CPU)

# ═══════════════════════════════════════
# Serialization / Config
# ═══════════════════════════════════════
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ═══════════════════════════════════════
# Tokenizer
# ═══════════════════════════════════════
unicode-segmentation = "1"          # UTF-8 segmentation (BPE fallback)
fastrand = "2"                      # fast RNG for sampling
ureq = { version = "2", features = ["json"] }
bytemuck = { version = "1", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# RUSTFLAGS="-C target-cpu=native" é esperado no build manual
